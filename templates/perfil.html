{% extends "base.html" %}

{% block title %}Perfil{% endblock %}

{% block content %}
<section class="content-section profile">
    <div class="profile-card">
        <p class="eyebrow">Cuenta de usuario</p>
        <h1>Perfil</h1>
        <div class="profile-user">
            <span>Usuario autenticado</span>
            <strong>{{ usuario }}</strong>
        </div>
        <div class="profile-actions">
            <a class="button secondary" href="{{ url_for('logout') }}">Cerrar sesión</a>
        </div>
    </div>
    <div class="author-signature">Autor: Miguel Quiroz</div>
</section>
{% endblock %}
